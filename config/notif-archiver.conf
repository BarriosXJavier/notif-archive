# Sample configuration for notif-archiver
#
# archive_root: base directory used to store screenshots and JSONL logs
# session_type_override: optionally force "x11" or "wayland"
# screenshot_delay_ms: delay before capture so the toast is visible
# screenshot_timeout_ms: kill a hung screenshot tool after this interval

archive_root=~/notif_archive
# session_type_override=wayland
screenshot_delay_ms=300
screenshot_timeout_ms=10000

[apps]
# One entry per notification app_name or desktop-entry hint to watch.
# Duplicate source names use the first mapping and produce a warning.
# Multiple source names may intentionally share one archive group.
#
# Plain form:
#   WhatsApp
#
# Mapped form:
#   whatsapp-for-linux = WhatsApp

WhatsApp
Telegram Desktop = Telegram
zapzap = WhatsApp
